run_name: phase6_A4_language_plus_vision_and_merger_from_stageA
train_json: data/splits/fit_A.json
output_dir: runs/phase6_A4_language_plus_vision_and_merger_from_stageA
init_adapter: runs/stageA_q3vl8b_r16/final_adapter
seed: 42
data_seed: 42
deterministic_sampling: true
attn_implementation: sdpa
smoke_reload_check: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
visual_encoder:
  enabled: true
  adapter_name: vision_encoder
  blocks: [23, 24, 25, 26]
  target_modules: [attn.qkv, attn.proj]
  target_rationale: attention-only arm; MLP paths were inspected live and reserved for a separate ablation
visual_merger:
  enabled: true
  adapter_name: visual_merger
  include_deepstack: true
  target_rationale: include the three live visual.deepstack_merger_list patch mergers plus the final visual merger
train:
  epochs: 1
  max_steps: 200
  lr: 2.0e-4
  language_lr: 2.0e-4
  vision_lr: 2.0e-5
  merger_lr: 5.0e-5
  explicit_optimizer: true
  weight_decay: 0.0
  warmup_ratio: 0.03
  scheduler: cosine
  grad_accum: 16
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  max_tokens: 12000
  save_steps: 50
  save_total_limit: 2
  logging_steps: 10
  dataloader_workers: 0
  benchmark_steps: 25
