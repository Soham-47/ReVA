run_name: stageB_q3vl8b_r16
train_json: data/splits/full_train.json
output_dir: runs/stageB_q3vl8b_r16
seed: 42
attn_implementation: sdpa
lora:
  r: 16
  alpha: 32
  dropout: 0.05
train:
  epochs: 2
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_ratio: 0.03
  scheduler: cosine
  grad_accum: 16
  max_grad_norm: 1.0
  bf16: true
  gradient_checkpointing: true
  max_tokens: 12000
  save_steps: 300
  save_total_limit: 2
  logging_steps: 10
  dataloader_workers: 8
  benchmark_steps: 50
